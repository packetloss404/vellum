[project]
name = "vellum"
version = "0.1.0"
description = "Durable thinking on consequential problems."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "anthropic==0.88.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pip-audit==2.10.1",
    "pip-tools==7.5.3",
    "pytest==9.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vellum*"]
