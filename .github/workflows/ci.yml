name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify lock files are current
        run: |
          python -m piptools compile --quiet --generate-hashes --strip-extras --resolver=backtracking --output-file=requirements.lock pyproject.toml
          python -m piptools compile --quiet --extra=dev --generate-hashes --strip-extras --allow-unsafe --resolver=backtracking --output-file=requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.lock
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  production-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose file
        env:
          VELLUM_API_TOKEN: ci-placeholder-token
          VELLUM_ENV_FILE: .env.production.example
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production images
        env:
          VELLUM_API_TOKEN: ci-placeholder-token
          VELLUM_ENV_FILE: .env.production.example
        run: docker compose -f docker-compose.prod.yml build
